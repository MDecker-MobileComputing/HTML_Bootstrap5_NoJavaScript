<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap Example: Table</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous">
        <style>
          <!--
              /* Rule to visualize the width of the container */
              /* .container-md { background-color: yellow; } */
          -->
        </style>
    </head>
    <body>

        <div class="container-md">

            <h1 class="mt-3 mb-5">Example table with Bootstrap</h1>

            <p class="mb-5">
                See <a href="https://getbootstrap.com/docs/5.3/content/tables/" target="_blank">here</a>
                for the options available when styling tables with Bootstrap.
            </p>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">Animal</th>
                        <th scope="col">Sound</th>
                        <th scope="col">Favorite food</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Cow</td>
                        <td>Moo</td>
                        <td>Grass</td>
                    </tr>
                    <tr>
                        <td>Dog</td>
                        <td>Woof</td>
                        <td>Bones</td>
                    </tr>
                    <tr>
                        <td>Cat</td>
                        <td>Meow</td>
                        <td>Fish</td>
                    </tr>
                    <tr>
                        <td>Sheep</td>
                        <td>Baa</td>
                        <td>Hay</td>
                    </tr>
                    <tr>
                        <td>Duck</td>
                        <td>Quack</td>
                        <td>Bread</td>
                    </tr>
                </tbody>
            </table>

        </div>

       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
               integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
               crossorigin="anonymous"></script>
    </body>
</html>
